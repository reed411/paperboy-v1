<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperboy Anime - Camera Motion Cadence</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      gap: 12px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      font-weight: bold;
      color: #2c3e50;
    }
    #camera-preview {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 110px;
      height: 85px;
      border-radius: 10px;
      border: 3px solid #fff;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      background: #ff6b6b;
      color: white;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="ui-panel">
    <div class="card">❤️ HP: <span id="hp">3</span></div>
    <div class="card">🚴 CADENCE: <span id="rpm">0</span> RPM</div>
  </div>

  <video id="camera-preview" autoplay playsinline muted></video>
  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <button onclick="startCamera()">📷 START CAMERA TRACKING</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camera-preview');
    let rpmDisplay = document.getElementById('rpm');

    let currentRPM = 0;
    let lastFrameData = null;
    let motionHistory = [];
    let lastPeakTime = performance.now();

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Camera Setup & Pixel Motion Tracker
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: 160, height: 120 }
        });
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(processCameraFrame);
      } catch (err) {
        alert('Camera access denied or unavailable: ' + err.message);
      }
    }

    function processCameraFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 40;
        tempCanvas.height = 30;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0, 40, 30);
        const frameData = tempCtx.getImageData(0, 0, 40, 30).data;

        if (lastFrameData) {
          let diff = 0;
          for (let i = 0; i < frameData.length; i += 4) {
            // Compare pixel brightness differences frame to frame
            diff += Math.abs(frameData[i] - lastFrameData[i]);
          }

          motionHistory.push(diff);
          if (motionHistory.length > 10) motionHistory.shift();

          let avgMotion = motionHistory.reduce((a, b) => a + b, 0) / motionHistory.length;

          // Detect pedal stroke peaks from leg movement
          if (avgMotion > 12000 && (performance.now() - lastPeakTime) > 350) {
            let timeDiff = (performance.now() - lastPeakTime) / 1000;
            lastPeakTime = performance.now();
            currentRPM = Math.round(60 / timeDiff);
            if (currentRPM > 140) currentRPM = 140;
          }
        }
        lastFrameData = frameData;
      }

      // Decelerate RPM naturally over time
      currentRPM = Math.max(0, currentRPM - 0.3);
      rpmDisplay.innerText = Math.round(currentRPM);

      requestAnimationFrame(processCameraFrame);
    }

    // 2. Simple Render Loop
    function render() {
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grass
      ctx.fillStyle = '#7ec850';
      ctx.fillRect(0, canvas.height * 0.5, canvas.width, canvas.height * 0.5);

      // Perspective Road
      ctx.fillStyle = '#7f8c8d';
      ctx.beginPath();
      ctx.moveTo(canvas.width * 0.45, canvas.height * 0.5);
      ctx.lineTo(canvas.width * 0.55, canvas.height * 0.5);
      ctx.lineTo(canvas.width * 0.9, canvas.height);
      ctx.lineTo(canvas.width * 0.1, canvas.height);
      ctx.fill();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
